<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Lrssn</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--lrssn-background); color: var(--lrssn-text-color); font-family: var(--lrssn-font-ui); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 0; width: 960px; height: 288px; }
  .art svg { display: block; width: 960px; height: 288px; }
  .brand { fill: var(--lrssn-primary-color); }
  .ember { fill: var(--lrssn-primary-text); }
  .cool { fill: var(--lrssn-secondary-color); }
  .ink { fill: var(--lrssn-text-color); }
  .dot { fill: var(--lrssn-primary-color); }
  .rule { stroke: var(--lrssn-margin-rule-color); stroke-width: 1; }
  .words { position: absolute; left: 24px; bottom: 24px; max-width: 440px; }
  .name { margin: 0; color: var(--lrssn-text-color); font-family: var(--lrssn-font-display); font-size: 120px; font-weight: 700; letter-spacing: -0.02em; line-height: 0.92; }
  .tagline { margin: 16px 0 0 4px; color: var(--lrssn-text-muted); font-size: 14px; line-height: 20px; }
</style>
</head>
<body>
<div class="cover">
