<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lrssn design system</title>
<meta name="description" content="Every component of the Lrssn design system, in Lrssn Shore and Lrssn Hearth. {{ generated }}">
<script>
{{ theme-init }}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../dist/lrssn.css">
<style>
/* The page around the examples: the components in their own words, each
 * shown twice, in Shore and in Hearth, side by side like two pages of one
 * notebook. The page itself follows the theme toggle. */
.preview-head {
  border-bottom: 1px solid var(--lrssn-border-color);
}

.preview-head-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--lrssn-space-6);
  padding-block: var(--lrssn-space-12) var(--lrssn-space-8);
}

.preview-title {
  margin: 0;
  font-family: var(--lrssn-font-display);
  font-size: var(--lrssn-font-size-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.02;
}

.preview-lede {
  max-width: 52ch;
  margin: var(--lrssn-space-4) 0 0;
  color: var(--lrssn-text-muted);
  font-size: var(--lrssn-font-size-lg);
}

.preview-nav {
  border-bottom: 1px solid var(--lrssn-border-color);
}

.preview-nav ul {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lrssn-space-2) var(--lrssn-space-5);
  margin-block: 0;
  padding-block: var(--lrssn-space-4);
  list-style: none;
  font-size: var(--lrssn-font-size-sm);
}

.preview-nav a {
  color: var(--lrssn-text-muted);
}

.preview-nav a:hover {
  color: var(--lrssn-text-color);
}

.component {
  padding-block: var(--lrssn-space-10);
  border-bottom: 1px solid var(--lrssn-border-color);
  scroll-margin-top: var(--lrssn-space-4);
}

.component-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--lrssn-space-2) var(--lrssn-space-4);
  margin-bottom: var(--lrssn-space-5);
}

.component-head h2 {
  margin: 0;
  font-size: var(--lrssn-font-size-2xl);
}

.component-head p {
  flex: 1 1 30ch;
  margin: 0;
  color: var(--lrssn-text-muted);
}

.component-head a {
  color: var(--lrssn-link-color);
  font-size: var(--lrssn-font-size-sm);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.panes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr));
  gap: var(--lrssn-space-4);
}

.panes--wide {
  grid-template-columns: minmax(0, 1fr);
}

.pane {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--lrssn-border-color);
  border-radius: var(--lrssn-radius-xl);
  background: var(--lrssn-background);
  color: var(--lrssn-text-color);
}

.pane-label {
  margin: 0;
  padding: var(--lrssn-space-2) var(--lrssn-space-4);
  border-bottom: 1px solid var(--lrssn-border-color);
  color: var(--lrssn-text-subtle);
  font-family: var(--lrssn-font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.pane-body {
  padding: var(--lrssn-space-6);
}

/* Rows and columns for the examples. */
.demo-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--lrssn-space-4) var(--lrssn-space-6);
}

.demo-stack {
  display: grid;
  gap: var(--lrssn-space-4);
}

.preview-foot {
  padding-block: var(--lrssn-space-8);
  color: var(--lrssn-text-subtle);
  font-family: var(--lrssn-font-mono);
  font-size: var(--lrssn-font-size-xs);
}
</style>
</head>
<body class="lrssn-page">
<header class="preview-head">
  <div class="preview-head-inner lrssn-container">
    <div>
      <h1 class="preview-title">Lrssn design system</h1>
      <p class="preview-lede">Every component, in Lrssn Shore and Lrssn Hearth. The page itself follows the toggle.</p>
    </div>
    <div class="lrssn-theme-toggle" role="group" aria-label="Colour theme">
      <button class="lrssn-theme-toggle__button" type="button" data-theme-choice="system" aria-label="System theme" title="System theme" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M6 14h4M8 11v3"/></svg>
      </button>
      <button class="lrssn-theme-toggle__button" type="button" data-theme-choice="light" aria-label="Light theme" title="Light theme" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>
      </button>
      <button class="lrssn-theme-toggle__button" type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
      </button>
    </div>
  </div>
</header>
<nav class="preview-nav" aria-label="Components">
  <ul class="lrssn-container">
{{ nav }}
  </ul>
</nav>
<main class="lrssn-container">
{{ sections }}
</main>
<footer class="preview-foot lrssn-container">
  <p>{{ generated }}</p>
</footer>
<script>
{{ scripts }}
</script>
</body>
</html>
